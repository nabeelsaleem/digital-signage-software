/* Search Bar */
.search-wrapper {

}
.search-wrapper i {

    left: 12px;

  <script>
        // --- CONFIGURATION ---
        // Global variables accessible to all functions
        let sb = null;
// Replace the 'let state = ...' line with:
let state = { user: null, media: [], playlists: [], devices: [], schedules: [], draft: [] };
let currentTab = localStorage.getItem('lastActiveTab') || 'media'; // Track tab for search & persistence
let tempCallback = null; // Store callback for custom modal
        // 1. Initialize App (Fetch Keys -> Start Supabase -> Listen for Auth)

// 1. IMPROVED INIT APP
        async function initApp() {
            try {
                const response = await fetch('/api/config');
                if (!response.ok) throw new Error('API Security Error');
                const config = await response.json();
                
                sb = supabase.createClient(config.supabaseUrl, config.supabaseKey);

                // This listener handles the UI transition immediately on login/logout
                sb.auth.onAuthStateChange(async (event, session) => {
                    console.log("Auth Event:", event);
                    
                    if (session) {
                        state.user = session.user;
                        document.getElementById('auth-view').classList.add('hidden');
                        document.getElementById('sidebar').classList.remove('hidden');
                        document.getElementById('main-content').classList.remove('hidden');
                        document.getElementById('sidebar').classList.add('flex');
                        document.getElementById('user-email').innerText = state.user.email;
                        nav(currentTab);
                    } else {
                        // Reset state on logout
                        state.user = null;
                        document.getElementById('auth-view').classList.remove('hidden');
                        document.getElementById('sidebar').classList.add('hidden');
                        document.getElementById('main-content').classList.add('hidden');
                        document.getElementById('sidebar').classList.remove('flex');
                    }
                });

            } catch (error) {
                console.error("Critical Load Error:", error);
                alert("Server Connection Failed. Please try again later.");
            }
        }

        // 2. IMPROVED GOOGLE SIGN IN (Forces Account Selection)
        async function signInGoogle() { 
            if(!sb) return; 
            await sb.auth.signInWithOAuth({ 
                provider: 'google', 
                options: { 
                    // This forces Google to always show the "Choose an account" screen
                    // preventing it from auto-logging you into the previous one
                    queryParams: {
                        prompt: 'select_account',
                        access_type: 'offline'
                    },
                    redirectTo: window.location.origin 
                } 
            }); 
        }

        // 3. SECURE LOGOUT
        async function logout() { 
            if(!sb) return;
            // Clear the Supabase session completely
            await sb.auth.signOut(); 
            // Redirect to home without any tokens in the URL
            window.location.href = window.location.origin; 
        }

        
// --- NAVIGATION ---
function nav(view) {
    ['media', 'playlists', 'devices', 'schedules'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
    document.getElementById(`view-${view}`).classList.remove('hidden');
    
    // 1. Track Tab (New Logic for Persistence)
    currentTab = view;
    localStorage.setItem('lastActiveTab', view);
    
    // 2. Reset Search (New Logic)
    document.getElementById('global-search').value = '';

    // 3. Update Active State in Sidebar
    document.querySelectorAll('.sidebar-link').forEach(el => {
        el.classList.remove('bg-slate-800', 'text-white');
        el.classList.add('text-slate-400');
        el.querySelector('div').classList.remove('text-brand-400'); 
    });

    const activeBtn = document.querySelector(`button[onclick="nav('${view}')"]`);
    if(activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('bg-slate-800', 'text-white');
        activeBtn.querySelector('div').classList.add('text-brand-400');
    }

    const btn = document.getElementById('header-actions');
    const title = document.getElementById('page-title');
    
    if (view === 'media') {
        title.innerText = 'Media Library';
        btn.innerHTML = `<button onclick="document.getElementById('media-upload-input').click()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-brand-500/20 flex items-center gap-2 transition-all"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Media</button>`;
        loadMedia();
    } else if (view === 'playlists') {
        title.innerText = 'Playlists';
        btn.innerHTML = `<button onclick="openPlaylistBuilder()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-brand-500/20 flex items-center gap-2 transition-all"><i class="fa-solid fa-plus"></i> New Playlist</button>`;
        loadPlaylists();
    } else if (view === 'schedules') {
        title.innerText = 'Schedules';
        btn.innerHTML = `<button onclick="openScheduleModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-brand-500/20 flex items-center gap-2 transition-all"><i class="fa-regular fa-calendar-plus"></i> Add Schedule</button>`;
        loadSchedules();
    } else {
        title.innerText = 'Screens';
        btn.innerHTML = `<button onclick="addDevice()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-brand-500/20 flex items-center gap-2 transition-all"><i class="fa-solid fa-plus"></i> New Screen</button>`;
        loadDevices();
    }
}

        // --- MEDIA ---
        async function loadMedia() {
            if(!sb) return;
            const { data, error } = await sb.from('media').select('*').order('id', {ascending: false});
            if(error) return showToast(error.message, 'error');
            state.media = data || [];
            filterMedia('all');
        }

        function filterMedia(type) {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = '';
            const filtered = type === 'all' ? state.media : state.media.filter(m => m.type.includes(type));
            
            // Toggle Filter Button Styles
            const buttons = document.querySelectorAll('#view-media button');
            buttons.forEach(b => {
                if(b.textContent.toLowerCase().includes(type) || (type === 'all' && b.textContent.includes('All'))) {
                    b.className = "px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-slate-900 text-white shadow-md";
                } else {
                    b.className = "px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-white hover:shadow-sm border border-transparent hover:border-slate-200 transition-all";
                }
            });

            if(filtered.length === 0) {

// Helper to render devices (used by loadDevices and Search)
// Helper to render devices (used by loadDevices and Search)
function renderDeviceCards(devicesData) {
    const list = document.getElementById('device-list');
    
    list.innerHTML = devicesData.map(d => {
        // --- SMART STATUS CALCULATION ---
        // 1. Calculate time difference
        const lastSeenDate = new Date(d.last_seen);
        const now = new Date();
        const diffSeconds = (now - lastSeenDate) / 1000;
        
        // 2. Determine Real Status
        // If not seen for 60 seconds, force OFFLINE
        const isOffline = diffSeconds > 60; 
        
        // 3. Determine Colors & Text
        let statusText = 'ONLINE';
        let statusColor = 'bg-emerald-50 text-emerald-600';
        let dotColor = 'bg-emerald-500';

        if (isOffline) {
            statusText = 'OFFLINE';
            statusColor = 'bg-red-50 text-red-600';
            dotColor = 'bg-red-500';
        } 
        else if (d.refresh_requested || d.screenshot_requested) {
            statusText = 'UPDATING';
            statusColor = 'bg-orange-50 text-orange-600';
            dotColor = 'bg-orange-500';
        }

        return `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg hover:border-brand-200 transition-all duration-300 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6 fade-enter">
            <div class="flex items-center gap-5 w-full lg:w-auto">
                <div class="relative group">
                    <div class="w-16 h-12 bg-slate-900 rounded-lg flex items-center justify-center font-mono text-white text-sm font-bold tracking-widest shadow-lg shadow-slate-200 select-all overflow-hidden whitespace-nowrap px-2">
                        ${d.code}
                    </div>
                    <button onclick="copyToClipboard('${d.code}')" class="absolute inset-0 bg-slate-900/90 flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity text-xs gap-1 rounded-lg">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                </div>
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <h4 class="font-bold text-lg text-slate-800">${d.name}</h4>
                        <button onclick="renameDevice(${d.id}, '${d.name}')" class="text-slate-300 hover:text-brand-600 transition-colors"><i class="fa-solid fa-pen-to-square"></i></button>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wide ${statusColor}">
                            <span class="w-1.5 h-1.5 rounded-full ${dotColor} ${!isOffline ? 'animate-pulse' : ''}"></span> ${statusText}
                        </span>
                        <span class="text-[10px] text-slate-400 font-mono">
                            <i class="fa-regular fa-clock mr-1"></i>${isOffline ? 'Last seen: ' + lastSeenDate.toLocaleTimeString() : 'Live'}
                        </span>
                    </div>

                </div>
            </div>
            
            <div class="flex flex-col lg:flex-row items-start lg:items-center gap-4 w-full lg:w-auto flex-1 lg:justify-end">
                <div class="w-full lg:w-64">
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Fallback Content</label>
                    <select onchange="assignPlaylist(${d.id}, this.value)" class="w-full text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 font-medium text-slate-600 focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer">
                        <option value="">Select Playlist...</option>
                        ${state.playlists.map(p => `<option value="${p.id}" ${d.playlist_id === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
                    </select>
                </div>

                <div class="flex items-center gap-2 mt-4 lg:mt-5 w-full lg:w-auto justify-between lg:justify-end">
                    <button onclick="requestScreenshot(${d.id})" class="p-2.5 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors" title="Capture Screenshot"><i class="fa-solid fa-camera"></i></button>
                    <button onclick="requestRefresh(${d.id})" class="p-2.5 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors" title="Force Player Refresh"><i class="fa-solid fa-rotate-right"></i></button>
                    <button onclick="deleteDevice(${d.id})" class="p-2.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Unlink Device"><i class="fa-solid fa-trash-can"></i></button>
                    
                    <div class="w-12 h-8 bg-slate-100 rounded border border-slate-200 overflow-hidden relative group cursor-pointer" onclick="${d.screenshot_url ? `window.open('${d.screenshot_url}')` : `requestScreenshot(${d.id})`}">
                        ${d.screenshot_url ? `<img src="${d.screenshot_url}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><i class="fa-solid fa-image text-xs"></i></div>`}
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
}

async function assignPlaylist(id, pid) { 
    try {
        const { error } = await sb
            .from('devices')
            .update({ 
                playlist_id: pid || null,
                last_updated: new Date().toISOString() // Track when content changed
            })
            .eq('id', id);
        
        if (error) throw error;
        
        showToast('Content assigned successfully', 'success');
        
        // Reload devices to show updated status
        loadDevices();
        
    } catch (error) {
        console.error('Assign playlist error:', error);
        showToast('Failed to assign content: ' + error.message, 'error');
    }
}

async function deleteDevice(id) { 
    if (!confirm("Unlink this screen? It will stop showing content and delete all data.")) {
        return;
    }
    
    try {
        const { error } = await sb
            .from('devices')
            .delete()
            .eq('id', id);
        
        if (error) throw error;
        
        showToast('Screen deleted successfully', 'success');
        loadDevices();
        
    } catch (error) {
        console.error('Delete device error:', error);
        showToast('Failed to delete screen: ' + error.message, 'error');
    }
}

        // --- UTILS ---
        function showToast(msg, type = 'info') {
            const div = document.createElement('div');
            let bgClass = 'bg-slate-800';
            let icon = '<i class="fa-solid fa-circle-info"></i>';
            
            if(type === 'error') { bgClass = 'bg-red-600'; icon = '<i class="fa-solid fa-circle-exclamation"></i>'; }
            if(type === 'success') { bgClass = 'bg-emerald-600'; icon = '<i class="fa-solid fa-circle-check"></i>'; }

            div.className = `toast ${bgClass} text-white px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium min-w-[300px] border border-white/10`;
            div.innerHTML = `<span class="text-lg">${icon}</span><span>${msg}</span>`;
            
            const container = document.getElementById('toast-container');
            container.appendChild(div);
            
            // Interaction to dismiss
            div.onclick = () => { div.remove(); };
            
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transform = 'translateY(10px)';
                setTimeout(() => div.remove(), 300);
            }, 4000);
        }

// --- UTILITIES: Custom Modal & Clipboard ---

function showCustomPrompt(title, initialValue, onSave) {
    document.getElementById('modal-title').innerText = title;
    const input = document.getElementById('modal-input');
    input.value = initialValue;
    
    // Show modal
    const modal = document.getElementById('custom-input-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    input.focus();

    // Handle Save
    const saveBtn = document.getElementById('modal-save-btn');
    // Remove old listeners to prevent duplicates
    const newBtn = saveBtn.cloneNode(true);
    saveBtn.parentNode.replaceChild(newBtn, saveBtn);
    
    newBtn.addEventListener('click', () => {
        if(input.value.trim()) {
            onSave(input.value.trim());
            closeCustomModal();
        } else {
            input.classList.add('border-red-500');
        }
    });
    
    // Allow Enter key
    input.onkeydown = (e) => {
        if(e.key === 'Enter') newBtn.click();
        input.classList.remove('border-red-500');
    };
}

function closeCustomModal() {
    document.getElementById('custom-input-modal').classList.add('hidden');
    document.getElementById('custom-input-modal').classList.remove('flex');
}

async function copyToClipboard(text) {
    try {
        await navigator.clipboard.writeText(text);
        showToast('Code copied to clipboard', 'success');
    } catch (err) {
        showToast('Failed to copy', 'error');
    }
}

// 1. Function called when you click the "Replace" button
function openReplaceDialog(mediaId) {
    replaceTargetId = mediaId;
    // Trigger the hidden file input
    document.getElementById('replace-file-input').click();

// 2. Event Listener that runs instantly when a file is selected
document.getElementById('replace-file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !replaceTargetId) return;

    // Optional: Update button text to show progress
    const btn = document.querySelector(`button[data-id="${replaceTargetId}"]`);
    if(btn) btn.innerText = '...';

    try {
        // Step A: Upload New File with a Unique Timestamp (Forces Player to reload)
        const fileName = `replaced_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
        const { data: uploadData, error: uploadError } = await sb.storage
            .from('media')
            .upload(fileName, file);

        if (uploadError) throw uploadError;

        // Step B: Get New Public URL
        const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(fileName);

        // Step C: UPDATE the existing row (Instead of Inserting new)
        const { error: dbError } = await sb
            .from('media')
            .update({
                name: file.name,     // Update Name
                type: file.type,     // Update Type (e.g., Image -> Video)
                url: publicUrl       // Update URL
            })
            .eq('id', replaceTargetId);

        if (dbError) throw dbError;

        alert('Media Replaced Successfully!');
        
        // REFRESH YOUR LIST
        if (typeof fetchMedia === 'function') fetchMedia(); 

    } catch (err) {
        console.error(err);
        alert('Replace Failed: ' + err.message);
    } finally {
        replaceTargetId = null;
        e.target.value = ''; // Reset input
    }
});
