<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliSign Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: black; cursor: none; overflow: hidden; }
        .pairing-mode { cursor: default; background: #0f172a; }
        .fade-enter { opacity: 0; transition: opacity 1s ease-in-out; }
        .fade-enter-active { opacity: 1; }
        /* Offline Dot Style */
        .status-offline {
            width: 12px;
            height: 12px;
            background-color: red;
            color: transparent; /* Hide text */
            padding: 0 !important;
            overflow: hidden;
            opacity: 0.8 !important;
        }
        
        /* Faded / Hidden Status (Normal Operation) */
        .status-idle {
            opacity: 0.05; /* Almost invisible */
        }
        
        /* Active Status (Downloading/Syncing) */
        .status-active {
            opacity: 0.8;
            background-color: rgba(0,0,0,0.6);
        }
    </style>
</head>
<body class="h-screen w-screen">

    <div id="pairing-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center pairing-mode text-white">
        <h1 class="text-xl tracking-widest text-slate-400 mb-8">ENTER PAIRING CODE</h1>
        <input id="pairing-code" type="text" maxlength="6" placeholder="------" 
            class="bg-slate-800 border-2 border-slate-700 text-6xl text-center py-6 w-96 uppercase tracking-[1rem] rounded-xl outline-none focus:border-blue-500 mb-8">
        <button onclick="pairDevice()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full text-xl transition shadow-lg shadow-blue-900/50">
            CONNECT
        </button>
        <p id="status-msg" class="text-red-500 mt-4 h-6"></p>
    </div>

    <div id="player-canvas" class="absolute inset-0 bg-black hidden">
        <img id="active-slide" class="w-full h-full object-contain absolute inset-0 fade-enter transition-opacity duration-1000">
        
        <video id="active-video" class="w-full h-full object-contain absolute inset-0 hidden" muted playsinline></video>
        
        <div id="status-pill" class="absolute bottom-4 right-4 text-white/50 text-[10px] px-2 py-1 rounded-full font-mono z-50 transition-all duration-500">Starting...</div>
    </div>

   

<script>
        // --- CONFIGURATION ---
        let sb = null;
        let deviceCode = localStorage.getItem('ss_device_code');
        let deviceId = null;
        let currentPlaylist = [];
        let currentIndex = 0;
        let imageCache = {};
        let isPlaying = false;
        let isOffline = false;

        // 1. ROBUST INIT
        async function initApp() {
            try {
                // Check if already offline
                if(!navigator.onLine) showOfflineMode();

                const response = await fetch('/api/config');
                if (!response.ok) throw new Error('Config Load Failed');
                
                const config = await response.json();
                sb = supabase.createClient(config.supabaseUrl, config.supabaseKey);
                
                // If paired, start loop. If not, show code.
                if (deviceCode) {
                    document.getElementById('pairing-code').value = deviceCode;
                    pairDevice(true);
                }
            } catch (error) {
                console.error("Init failed:", error);
                // Retry in 5 seconds if init fails (e.g. internet down on boot)
                setTimeout(initApp, 5000); 
            }
        }

        // 2. NETWORK LISTENERS (Handle drops gracefully)
        window.addEventListener('offline', () => { showOfflineMode(); });
        window.addEventListener('online', () => { 
            isOffline = false; 
            document.getElementById('status-pill').style.backgroundColor = 'rgba(0,0,0,0.5)';
            updateStatus('Online - Recovered');
        });

        function showOfflineMode() {
            isOffline = true;
            updateStatus('OFFLINE - Playing Cache');
            document.getElementById('status-pill').style.backgroundColor = 'red';
        }

        // 3. PAIRING
        async function pairDevice(silent = false) {
            if(!sb) return;
            const code = document.getElementById('pairing-code').value.toUpperCase();
            
            if(!silent) document.querySelector('button').innerText = 'CONNECTING...';

            // Safe DB Call
            const { data, error } = await sb.from('devices').select('id, code').eq('code', code).single();
            
            if (error || !data) {
                if(!silent) {
                    document.getElementById('status-msg').innerText = 'Invalid Code / No Internet';
                    document.querySelector('button').innerText = 'CONNECT';
                }
                return; // Stop here, don't start loop
            }

            localStorage.setItem('ss_device_code', code);
            deviceCode = code;
            deviceId = data.id;
            
            document.getElementById('pairing-screen').classList.add('hidden');
            document.getElementById('player-canvas').classList.remove('hidden');
            
            runHeartbeatLoop();
        }

        // 4. ROBUST LOOP (Replacing simple setInterval)
        async function runHeartbeatLoop() {
            // Prevent crashing if offline
            if (!isOffline && sb) {
                try {
                    await checkUpdates();
                } catch (e) {
                    console.warn("Heartbeat skipped:", e);
                }
            }
            // Recursive call instead of setInterval prevents "pile up" if network is slow
            setTimeout(runHeartbeatLoop, 15000);
        }

        async function checkUpdates() {
            updateStatus('Checking...');
            
            // 1. Heartbeat (Don't crash if fails)
            await sb.from('devices').update({ status: 'online', last_seen: new Date() }).eq('code', deviceCode).then(() => {});

            // 2. Fetch Device Data
            const { data: device, error: devErr } = await sb.from('devices').select('id, playlist_id').eq('id', deviceId).single();
            if(devErr || !device) return; // Device might be deleted or network error

            // 3. CHECK SCHEDULES
            const now = new Date();
            const timeStr = now.toTimeString().slice(0, 5); 
            const { data: schedules } = await sb.from('schedules').select('*').eq('device_id', deviceId);
            
            let activeId = device.playlist_id; 
            let statusText = 'Default Playlist';

            if(schedules && schedules.length > 0) {
                const match = schedules.find(s => {
                    const start = s.start_time.slice(0,5);
                    const end = s.end_time.slice(0,5);
                    return timeStr >= start && timeStr <= end;
                });

                if(match) { 
                    activeId = match.playlist_id; 
                    statusText = `Scheduled (${match.start_time.slice(0,5)} - ${match.end_time.slice(0,5)})`; 
                }
            }

            if (!activeId) { stopPlayback(); updateStatus('No Content'); return; }

            const { data: pl } = await sb.from('playlists').select('items').eq('id', activeId).single();
            if (!pl || !pl.items || !pl.items.length) { stopPlayback(); return; }

            // Sync Media
            const ids = pl.items.map(i => i.id);
            const { data: media } = await sb.from('media').select('id, url').in('id', ids);
            
            if(!media) return; // DB Error

            const newQueue = pl.items.map(i => {
                const f = media.find(m => m.id === i.id);
                return f ? { ...f, duration: i.duration } : null;
            }).filter(Boolean);

            if (JSON.stringify(newQueue) !== JSON.stringify(currentPlaylist)) {
                console.log("Playlist Sync:", statusText);
                currentPlaylist = newQueue;
                currentIndex = 0;
                preloadImages(currentPlaylist);
                if (!isPlaying) runLoop();
            }
            updateStatus(statusText);
        }


    function updateStatus(msg, type = 'normal') { 
            const el = document.getElementById('status-pill');
            
            if (msg.includes('OFFLINE')) {
                // Show Red Dot
                el.innerText = '';
                el.className = 'absolute bottom-2 right-2 rounded-full z-50 transition-all duration-500 status-offline';
            } else if (msg.includes('Scheduled') || msg.includes('Default')) {
                // Content Playing (Fade out)
                el.innerText = msg;
                el.className = 'absolute bottom-4 right-4 text-white px-3 py-1 rounded-full font-mono z-50 transition-all duration-500 status-idle';
            } else {
                // Active System Message (Downloading / Checking)
                el.innerText = msg;
                el.className = 'absolute bottom-4 right-4 text-white px-3 py-1 rounded-full font-mono z-50 transition-all duration-500 status-active';
            }
        }
    
    function stopPlayback() { currentPlaylist = []; isPlaying = false; document.getElementById('active-slide').src = ''; }
        
        function preloadImages(q) { 
            q.forEach(i => { 
                // Only preload images
                if(i.type.includes('image') && !imageCache[i.url]) { 
                    const img = new Image(); 
                    img.src = i.url; 
                    imageCache[i.url] = img; 
                } 
            }); 
        }

       function runLoop() {
            if (!currentPlaylist.length) return;
            isPlaying = true;
            
            const item = currentPlaylist[currentIndex];
            const imgEl = document.getElementById('active-slide');
            const vidEl = document.getElementById('active-video');
            
            // Determine Duration (Default to item duration or 10s)
            let duration = (item.duration || 10) * 1000;

            if (item.type.includes('video')) {
                // --- VIDEO MODE ---
                imgEl.classList.add('hidden');    // Hide Image
                vidEl.classList.remove('hidden'); // Show Video
                
                vidEl.src = item.url;
                vidEl.play().catch(e => console.error("Video Play Error:", e));

                // If duration is set to 0 in CMS, play full video length
                // Otherwise, cut it off at the specific duration
                vidEl.onended = () => {
                   // If we are relying on natural video end
                   if (item.duration === 0) nextSlide();
                };
                
            } else {
                // --- IMAGE MODE ---
                vidEl.classList.add('hidden');      // Hide Video
                vidEl.pause();                      // Stop Video
                imgEl.classList.remove('hidden');   // Show Image
                
                // Fade Effect
                imgEl.classList.remove('fade-enter-active');
                setTimeout(() => {
                    imgEl.src = item.url;
                    imgEl.classList.add('fade-enter-active');
                }, 100);
            }

            // Schedule Next Slide
            // If it's a video with duration 0, we wait for 'onended' event above.
            // Otherwise, we use the timer.
            if (!item.type.includes('video') || item.duration > 0) {
                setTimeout(nextSlide, duration);
            }
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            runLoop();
        }

            const nextDuration = (item.duration || 10) * 1000;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            
            setTimeout(runLoop, nextDuration);
        }

        // 5. MEMORY LEAK PREVENTION (Refresh once every 24h)
        setTimeout(() => {
            window.location.reload();
        }, 24 * 60 * 60 * 1000);

        // Start
        initApp();
    </script>
</body>
</html>
