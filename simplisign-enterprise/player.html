<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliSign Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: black; cursor: none; overflow: hidden; }
        .pairing-mode { cursor: default; background: #0f172a; }
        .fade-enter { opacity: 0; transition: opacity 1s ease-in-out; }
        .fade-enter-active { opacity: 1; }
        /* Offline Dot Style */
        .status-offline {
            width: 12px;
            height: 12px;
            background-color: red;
            color: transparent; /* Hide text */
            padding: 0 !important;
            overflow: hidden;
            opacity: 0.8 !important;
        }
        
        /* Faded / Hidden Status (Normal Operation) */
        .status-idle {
            opacity: 0.05; /* Almost invisible */
        }
        
        /* Active Status (Downloading/Syncing) */
        .status-active {
            opacity: 0.8;
            background-color: rgba(0,0,0,0.6);
        }
    </style>
</head>
<body class="h-screen w-screen">

    <div id="pairing-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center pairing-mode text-white">
        <h1 class="text-xl tracking-widest text-slate-400 mb-8">ENTER PAIRING CODE</h1>
        <input id="pairing-code" type="text" maxlength="6" placeholder="------" 
            class="bg-slate-800 border-2 border-slate-700 text-6xl text-center py-6 w-96 uppercase tracking-[1rem] rounded-xl outline-none focus:border-blue-500 mb-8">
        <button onclick="pairDevice()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full text-xl transition shadow-lg shadow-blue-900/50">
            CONNECT
        </button>
        <p id="status-msg" class="text-red-500 mt-4 h-6"></p>
    </div>

    <div id="player-canvas" class="absolute inset-0 bg-black hidden">
        <img id="active-slide" class="w-full h-full object-contain absolute inset-0 fade-enter transition-opacity duration-1000">
        
        <video id="active-video" class="w-full h-full object-contain absolute inset-0 hidden" muted playsinline></video>
        
        <div id="status-pill" class="absolute bottom-4 right-4 text-white/50 text-[10px] px-2 py-1 rounded-full font-mono z-50 transition-all duration-500">Starting...</div>
    </div>

   

<script>
        // --- CONFIGURATION ---
        let sb = null;
        let deviceCode = localStorage.getItem('ss_device_code');
        let deviceId = null;
        let currentPlaylist = [];
        let currentIndex = 0;
        let imageCache = {};
        let isPlaying = false;
        let isOffline = false;

        // 1. ROBUST INIT
       // 1. ROBUST INIT (Offline First)
        async function initApp() {
            console.log("🚀 Booting SimpliSign Player...");

            // --- STEP A: Storage Check (Prevent Infinite Loop) ---
            try {
                localStorage.setItem('ss_test', '1');
                localStorage.removeItem('ss_test');
            } catch (e) {
                document.body.innerHTML = '<div style="color:white; text-align:center; padding-top:20%; font-family:sans-serif;"><h1>Storage Blocked</h1><p>Please enable cookies/site data for this domain.</p></div>';
                return; 
            }

            // --- STEP B: Load Credentials & Cache ---
            const savedCode = localStorage.getItem('ss_device_code');
            const savedPlaylist = localStorage.getItem('cached_playlist');

            // --- STEP C: Offline Playback (Critical for Morning Boot) ---
            if (savedPlaylist && savedCode) {
                try {
                    const parsed = JSON.parse(savedPlaylist);
                    if (parsed.length > 0) {
                        console.log("📦 Found cached content. Playing immediately...");
                        
                        // Restore state from cache
                        deviceCode = savedCode;
                        currentPlaylist = parsed;
                        
                        // Hide pairing screen & Start Playing
                        document.getElementById('pairing-screen').classList.add('hidden');
                        document.getElementById('player-canvas').classList.remove('hidden');
                        updateStatus('Offline Playback');
                        
                        // Start the loop
                        preloadMedia(currentPlaylist); // Preload images
                        if (!isPlaying) runLoop();
                    }
                } catch (e) {
                    console.error("Cache corrupted:", e);
                }
            }

            // --- STEP D: Network Connection (Background) ---
            if (!navigator.onLine) {
                showOfflineMode();
                console.log("📡 Device is offline. Skipping network connect.");
                return; // Stop here if offline (we are already playing cache above)
            }

            try {
                const response = await fetch('/api/config');
                if (!response.ok) throw new Error('Config Load Failed');
                const config = await response.json();
                sb = supabase.createClient(config.supabaseUrl, config.supabaseKey);
                
                // If we have a code, try to "Go Online" officially
                if (deviceCode) {
                    console.log("🌐 Connecting to server...");
                    await pairDevice(true); 
                } else {
                    console.log("⚠️ New Device. Waiting for pairing.");
                    // Only show pairing screen if we aren't already playing cache
                    if (!currentPlaylist.length) {
                        document.getElementById('pairing-screen').classList.remove('hidden');
                    }
                }
            } catch (error) {
                console.error("Network Init Failed:", error);
                // If we have cache, we don't care about this error.
                if (!currentPlaylist.length) {
                    setTimeout(initApp, 5000); // Retry only if screen is empty
                }
            }
        }


        // 2. NETWORK LISTENERS (Handle drops gracefully)
        // 2. NETWORK LISTENERS (Handle drops gracefully)
        window.addEventListener('offline', () => { showOfflineMode(); });
        
        window.addEventListener('online', async () => { 
            console.log("[System] Network connection restored.");
            isOffline = false; 
            document.getElementById('status-pill').style.backgroundColor = 'rgba(0,0,0,0.5)';
            updateStatus('Online - Recovering...');

            // CRITICAL FIX: If we booted offline, we have no Server Connection (sb) and no Device ID.
            // We must re-run the initialization logic to fetch keys and log in.
            if (!sb || !deviceId) {
                console.log("[System] Re-initializing connection to server...");
                await initApp();
            }
        });

        

   async function pairDevice(silent = false) {
            // Get code from storage (if silent) or input box
            let code = silent ? deviceCode : document.getElementById('pairing-code').value.toUpperCase();
            
            if (!code) return;

            if(!silent) document.querySelector('button').innerText = 'CONNECTING...';

            try {
                const req = await fetch(`/api/player-handler?code=${code}`);
                
                // --- THE FIX IS HERE ---
                if (!req.ok) {
                    // If the server says 500 (Error) or 404 (Not Found), the code is dead.
                    if (silent) {
                        console.warn("Saved code is invalid (Device Deleted). Resetting...");
                        localStorage.removeItem('ss_device_code'); // <--- WIPE MEMORY
                        location.reload(); // <--- RESTART FRESH
                        return;
                    }
                    throw new Error('Invalid Code');
                }
                // -----------------------
                
                const data = await req.json();

                if (!data.id) throw new Error('No Device ID returned');

                localStorage.setItem('ss_device_code', code);
                deviceCode = code;
                deviceId = data.id;
                
                document.getElementById('pairing-screen').classList.add('hidden');
                document.getElementById('player-canvas').classList.remove('hidden');
                
                if (!window.heartbeatRunning) {
                    window.heartbeatRunning = true; 
                    runHeartbeatLoop();
                }

            } catch (e) {
                console.error("Pairing Error:", e);
                if(!silent) {
                    document.getElementById('status-msg').innerText = 'Connection Failed';
                    document.querySelector('button').innerText = 'CONNECT';
                }
            }
        }
        // 4. ROBUST LOOP (Replacing simple setInterval)
        async function runHeartbeatLoop() {
            // Prevent crashing if offline
            if (!isOffline && sb) {
                try {
                    await checkUpdates();
                } catch (e) {
                    console.warn("Heartbeat skipped:", e);
                }
            }
            // Recursive call instead of setInterval prevents "pile up" if network is slow
            setTimeout(runHeartbeatLoop, 15000);
        }

      
async function checkUpdates() {
            updateStatus('Checking...');

            try {
                // 1. SECURE API CALL
                const req = await fetch(`/api/player-handler?deviceId=${deviceId}`);
                
                // --- CRITICAL FIX: Handle Deleted Devices (500/404 Error) ---
                if (!req.ok) {
                    console.error("API Fetch Failed:", req.status);
                    // If the device was deleted from CMS while playing, reset locally
                    if (req.status === 500 || req.status === 404) {
                         console.warn("Device deleted on server. Resetting player...");
                         localStorage.removeItem('ss_device_code');
                         window.location.reload(true);
                         return;
                    }
                    // For other internet errors, just wait for next cycle
                    updateStatus('Connection Error');
                    return; 
                }
                
                const response = await req.json();
                
                // Safety Check: Ensure response is valid
                if (!response || !response.device) return;

                const { device, playlist } = response;

                // 2. REMOTE REFRESH LOGIC
                if (device.refresh_requested) {
                    updateStatus('Updating...');
                    
                    // --- FIX: You are missing the opening line below ---
                    setTimeout(() => { 
                        window.location.reload(true); 
                    }, 1000);
                    // --------------------------------------------------
                    
                    return; 
                }

                // 3. REMOTE UNPAIR LOGIC (New Feature)
                if (device.unpair_requested) {
                    updateStatus('Unpairing...');
                    localStorage.removeItem('ss_device_code');
                    window.location.reload(true);
                    return;
                }

                // 4. REMOTE SCREENSHOT LOGIC (Your Request)
                if (device.screenshot_requested) {
                    updateStatus('Capturing Screen...');
                    
                    try {
                        const canvas = await html2canvas(document.body, {
                            useCORS: true,
                            allowTaint: true,
                            ignoreElements: (element) => element.tagName === 'VIDEO' && element.readyState < 2
                        });
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
                        const fileName = `screenshots/${deviceId}.jpg`;

                        await sb.storage.from('media').upload(fileName, blob, { upsert: true });
                        const { data: publicUrl } = sb.storage.from('media').getPublicUrl(fileName);

                        await sb.from('devices').update({ 
                            screenshot_url: publicUrl.publicUrl, 
                            screenshot_requested: false 
                        }).eq('id', deviceId);
                        
                        updateStatus('Screenshot Uploaded');
                    } catch (err) {
                        console.error("Screenshot Failed:", err);
                        // Don't crash the player if screenshot fails, just continue
                    }
                }

                // 5. SYNC PLAYLIST (With Memory Cleaning)
                if (playlist && Array.isArray(playlist)) {
                    if (JSON.stringify(playlist) !== JSON.stringify(currentPlaylist)) {
                        console.log("New Playlist Received");
                        
                        localStorage.setItem('cached_playlist', JSON.stringify(playlist));

                        // Clear old memory to prevent crashes
                        imageCache = {}; 
                        
                        currentPlaylist = playlist;
                        currentIndex = 0;
                        
                        // Use the SAFE preloader (handles missing types)
                        if (typeof preloadMedia === "function") {
                             preloadMedia(currentPlaylist);
                        } else if (typeof preloadImages === "function") {
                             preloadImages(currentPlaylist);
                        }

                        if (!isPlaying && currentPlaylist.length > 0) {
                            runLoop();
                        }
                    }
                }
                
                updateStatus('Online');

            } catch (error) {
                console.error("Update Error:", error);
                // Keep playing current content if update fails
            }
        }

    function updateStatus(msg, type = 'normal') { 
            const el = document.getElementById('status-pill');
            
            if (msg.includes('OFFLINE')) {
                // Show Red Dot
                el.innerText = '';
                el.className = 'absolute bottom-2 right-2 rounded-full z-50 transition-all duration-500 status-offline';
            } else if (msg.includes('Scheduled') || msg.includes('Default')) {
                // Content Playing (Fade out)
                el.innerText = msg;
                el.className = 'absolute bottom-4 right-4 text-white px-3 py-1 rounded-full font-mono z-50 transition-all duration-500 status-idle';
            } else {
                // Active System Message (Downloading / Checking)
                el.innerText = msg;
                el.className = 'absolute bottom-4 right-4 text-white px-3 py-1 rounded-full font-mono z-50 transition-all duration-500 status-active';
            }
        }
    
    function stopPlayback() { currentPlaylist = []; isPlaying = false; document.getElementById('active-slide').src = ''; }
        
      function preloadMedia(q) { 
    q.forEach(i => { 
        if (imageCache[i.url]) return; // Already processed

        const type = i.type || 'image'; 

        if (type.includes('image')) { 
            const img = new Image(); 
            img.src = i.url; 
            imageCache[i.url] = img; 
        } 
        else if (type.includes('video')) {
            // STEP 1: Fetch the video to force it into the Browser Cache
            fetch(i.url, { mode: 'cors' }).then(r => {
                if (!r.ok) throw new Error("Video preload failed");
                
                // STEP 2: Just mark it as 'true'. 
                // We don't need to store the Blob or a BlobURL in RAM.
                // When the <video> tag later sets src = i.url, 
                // the browser will see it's already in the cache and play instantly.
                imageCache[i.url] = true; 
                console.log("Video cached in browser storage:", i.url);
            }).catch(err => console.error("Video Preload Fail:", err));
        }
    }); 
}

       function runLoop() {
            if (!currentPlaylist.length) return;
            isPlaying = true;
            
            const item = currentPlaylist[currentIndex];
            const imgEl = document.getElementById('active-slide');
            const vidEl = document.getElementById('active-video');
            
            // Determine Duration (Default to item duration or 10s)
            let duration = (item.duration || 10) * 1000;

            if (item.type.includes('video')) {
                // --- VIDEO MODE ---
                imgEl.classList.add('hidden');    // Hide Image
                vidEl.classList.remove('hidden'); // Show Video
                
                vidEl.src = item.url;
                vidEl.play().catch(e => console.error("Video Play Error:", e));

                // If duration is set to 0 in CMS, play full video length
                // Otherwise, cut it off at the specific duration
                vidEl.onended = () => {
                   // If we are relying on natural video end
                   if (item.duration === 0) nextSlide();
                };
                
            } else {
                // --- IMAGE MODE ---
                vidEl.classList.add('hidden');      // Hide Video
                vidEl.pause();                      // Stop Video
                imgEl.classList.remove('hidden');   // Show Image
                
                // Fade Effect
                imgEl.classList.remove('fade-enter-active');
                setTimeout(() => {
                    imgEl.src = item.url;
                    imgEl.classList.add('fade-enter-active');
                }, 100);
            }

            // Schedule Next Slide
            // If it's a video with duration 0, we wait for 'onended' event above.
            // Otherwise, we use the timer.
            if (!item.type.includes('video') || item.duration > 0) {
                setTimeout(nextSlide, duration);
            }
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            runLoop();
        }

           
        

        // 5. MEMORY LEAK PREVENTION (Refresh once every 24h)
        setTimeout(() => {
            window.location.reload();
        }, 24 * 60 * 60 * 1000);

        // Start
        initApp();

// 6. SERVICE WORKER REGISTRATION (Keeps the App Alive Offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('✅ ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('❌ ServiceWorker registration failed: ', err);
                    });
            });
        }


    </script>
</body>
</html>
