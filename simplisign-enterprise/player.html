<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliSign Player</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #030712; /* Gray 950 */
            cursor: none; 
            overflow: hidden; 
        }
        
        /* Reveal cursor only on pairing screen */
        .pairing-active { cursor: default; }

        /* Transitions */
        .fade-enter { opacity: 0; transition: opacity 1s ease-in-out; }
        .fade-enter-active { opacity: 1; }
        
        /* Status Dot System (Redesigned) */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: all 0.5s ease;
        }
        .status-red { background-color: #ef4444; opacity: 1; box-shadow: 0 0 10px #ef4444; } /* Offline */
        .status-orange { background-color: #f97316; opacity: 1; animation: pulse 2s infinite; } /* Working */
        .status-green { background-color: #10b981; opacity: 0; } /* Online (Hidden) */
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
    </style>
</head>
<body class="h-screen w-screen text-white font-sans antialiased selection:bg-brand-500 selection:text-white">

    <div id="pairing-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-between p-12 bg-gray-950 pairing-active transition-opacity duration-500">
        
        <div class="flex flex-col items-center gap-5 mt-10">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-brand-600 to-indigo-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                <div class="relative w-20 h-20 bg-gray-900 rounded-2xl flex items-center justify-center border border-gray-800 shadow-2xl">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-brand-500">
                        <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
                        <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
                    </svg>
                </div>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">SimpliSign Player</h1>
        </div>

        <div class="w-full max-w-lg flex flex-col items-center gap-8">
            <div class="text-center space-y-2">
                <h2 class="text-lg font-medium text-gray-400 uppercase tracking-widest">Pairing Code</h2>
                <p class="text-sm text-gray-500">Enter this code in your CMS dashboard</p>
            </div>

            <div class="relative w-full group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-brand-500 to-indigo-500 rounded-xl blur opacity-30 group-hover:opacity-75 transition duration-1000 group-hover:duration-200"></div>
                <input id="pairing-code" type="text" maxlength="6" placeholder="------" 
                    class="relative w-full bg-gray-900 border-2 border-gray-800 text-6xl font-mono font-bold text-center py-8 rounded-xl outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-white placeholder-gray-800 uppercase tracking-[1.5rem] transition-all shadow-2xl">
            </div>

            <button onclick="pairDevice()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-4 px-8 rounded-xl text-lg transition-all shadow-lg shadow-brand-500/20 flex items-center justify-center gap-3 group">
                <span>CONNECT DEVICE</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:translate-x-1 transition-transform">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
            </button>
            
            <p id="status-msg" class="text-red-400 font-medium h-6 text-sm"></p>
        </div>

        <div class="flex flex-col items-center gap-6 mb-8 w-full max-w-2xl">
            <div class="flex flex-wrap justify-center gap-4 md:gap-8 text-sm text-gray-500 bg-gray-900/50 px-8 py-4 rounded-full border border-gray-800/50 backdrop-blur-sm">
                <div class="flex items-center gap-3">
                    <span class="w-6 h-6 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-xs font-bold text-gray-300">1</span>
                    <span>Login to Dashboard</span>
                </div>
                <div class="hidden md:block w-px h-6 bg-gray-800"></div>
                <div class="flex items-center gap-3">
                    <span class="w-6 h-6 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-xs font-bold text-gray-300">2</span>
                    <span>Click "New Screen"</span>
                </div>
                <div class="hidden md:block w-px h-6 bg-gray-800"></div>
                <div class="flex items-center gap-3">
                    <span class="w-6 h-6 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-xs font-bold text-gray-300">3</span>
                    <span>Enter Code</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2 text-gray-600 hover:text-brand-500 transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
                    <path fill-rule="evenodd" d="M4.25 5.5a.75.75 0 00-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 00.75-.75v-4a.75.75 0 011.5 0v4A2.25 2.25 0 0112.75 17h-8.5A2.25 2.25 0 012 14.75v-8.5A2.25 2.25 0 014.25 4h5a.75.75 0 010 1.5h-5z" clip-rule="evenodd" />
                    <path fill-rule="evenodd" d="M6.194 12.753a.75.75 0 001.06.053L16.5 4.44v2.81a.75.75 0 001.5 0v-4.5a.75.75 0 00-.75-.75h-4.5a.75.75 0 000 1.5h2.553l-9.056 8.194a.75.75 0 00-.053 1.06z" clip-rule="evenodd" />
                </svg>
                <span class="text-xs font-bold uppercase tracking-widest">www.metaworcs.com</span>
            </div>
        </div>
    </div>

    <div id="player-canvas" class="absolute inset-0 bg-black hidden overflow-hidden">
        <img id="active-slide" class="w-full h-full object-contain absolute inset-0 fade-enter transition-opacity duration-1000">
        <video id="active-video" class="w-full h-full object-contain absolute inset-0 hidden" muted playsinline></video>
        
        <iframe id="active-iframe" class="w-full h-full absolute inset-0 hidden border-0" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
        
        <div id="active-widget" class="w-full h-full absolute inset-0 hidden flex items-center justify-center flex-col p-12 transition-opacity duration-1000"></div>
        
        <img id="sticky-logo" class="absolute hidden z-[60] max-w-[200px] max-h-[200px] object-contain drop-shadow-2xl">
        <div id="status-pill" class="status-dot status-orange"></div>
    </div>

<script>
        // --- CONFIGURATION ---
        let sb = null;
        let deviceCode = localStorage.getItem('ss_device_code');
        let deviceId = null;
        let currentPlaylist = [];
        let currentIndex = 0;
        let imageCache = {};
        let isPlaying = false;
        let isOffline = false;

        // 1. ROBUST INIT (Offline First)
        async function initApp() {
            console.log("🚀 Booting SimpliSign Player...");

            // --- STEP A: Storage Check ---
            try {
                localStorage.setItem('ss_test', '1');
                localStorage.removeItem('ss_test');
            } catch (e) {
                document.body.innerHTML = '<div style="color:white; text-align:center; padding-top:20%; font-family:sans-serif;"><h1>Storage Blocked</h1><p>Please enable cookies/site data for this domain.</p></div>';
                return; 
            }

            const savedCode = localStorage.getItem('ss_device_code');
            const savedPlaylist = localStorage.getItem('cached_playlist');

            // --- STEP B: Offline Playback ---
            // VS CODE FIX: Added '!isPlaying' to prevent stuttering if this function retries
            if (!isPlaying && savedPlaylist && savedCode) {
                try {
                    const parsed = JSON.parse(savedPlaylist);
                    if (parsed.length > 0) {
                        console.log("📦 Found cached content. Playing immediately...");
                        deviceCode = savedCode;
                        currentPlaylist = parsed;
                        
                        document.getElementById('pairing-screen').classList.add('hidden');
                        document.getElementById('player-canvas').classList.remove('hidden');
                        updateStatus('Offline Playback');
                        
                        preloadMedia(currentPlaylist);
                        runLoop();
                    }
                } catch (e) {
                    console.error("Cache corrupted:", e);
                }
            }

            // --- STEP C: Network Connection ---
            if (!navigator.onLine) {
                showOfflineMode();
                return; 
            }

            try {
                const response = await fetch('/api/config');
                if (!response.ok) throw new Error('Config Load Failed');
                const config = await response.json();
                sb = supabase.createClient(config.supabaseUrl, config.supabaseKey);
                
                if (deviceCode) {
                    console.log("🌐 Connecting to server...");
                    await pairDevice(true); 
                } else if (!currentPlaylist.length) {
                    console.log("⚠️ New Device. Waiting for pairing.");
                    document.getElementById('pairing-screen').classList.remove('hidden');
                }
            } catch (error) {
                console.error("Network Init Failed:", error);
                // VS CODE FIX: Always retry in background (Zombie Fix)
                setTimeout(initApp, 10000); 
            }
        }


        // 2. NETWORK LISTENERS (Handle drops gracefully)
        window.addEventListener('offline', () => { showOfflineMode(); });
        
        window.addEventListener('online', async () => { 
            console.log("[System] Network connection restored.");
            isOffline = false; 
            updateStatus('Online - Recovering...');

            // CRITICAL FIX: If we booted offline, we have no Server Connection (sb) and no Device ID.
            // We must re-run the initialization logic to fetch keys and log in.
            if (!sb || !deviceId) {
                console.log("[System] Re-initializing connection to server...");
                await initApp();
            }
        });

        

async function pairDevice(silent = false) {
            let code = silent ? deviceCode : document.getElementById('pairing-code').value.toUpperCase();
            if (!code) return;

            if(!silent) document.querySelector('button').innerText = 'CONNECTING...';

            try {
                const req = await fetch(`/api/player-handler?code=${code}`);
                
                if (!req.ok) {
                    // Critical Fix: Only wipe memory on 404 (Device Deleted).
                    // For 500 (Server Error), we throw to retry later.
                    if (silent && req.status === 404) {
                        console.warn("Saved code is invalid (Device Deleted). Resetting...");
                        localStorage.removeItem('ss_device_code'); 
                        location.reload(); 
                        return;
                    }
                    throw new Error(`Server Error: ${req.status}`);
                }
                
                const data = await req.json();
                if (!data.id) throw new Error('No Device ID returned');

                localStorage.setItem('ss_device_code', code);
                deviceCode = code;
                deviceId = data.id;
                
                document.getElementById('pairing-screen').classList.add('hidden');
                document.getElementById('player-canvas').classList.remove('hidden');
                
                if (!window.heartbeatRunning) {
                    window.heartbeatRunning = true; 
                    runHeartbeatLoop();
                }

            } catch (e) {
                console.error("Pairing Error:", e);
                if(!silent) {
                    document.getElementById('status-msg').innerText = 'Connection Failed. Check Code.';
                    document.querySelector('button').innerText = 'CONNECT DEVICE';
                }
            }
        }

        async function runHeartbeatLoop() {
            // Prevent crashing if offline
            if (!isOffline && sb) {
                try {
                    await checkUpdates();
                } catch (e) {
                    console.warn("Heartbeat skipped:", e);
                }
            }
            // Recursive call instead of setInterval prevents "pile up" if network is slow
            setTimeout(runHeartbeatLoop, 15000);
        }

      
async function checkUpdates() {
            updateStatus('Checking...');

            try {
                // 1. SECURE API CALL (Now sends CODE + DEVICE ID + TIMEZONE)
                // Detect browser's timezone (e.g., "America/New_York")
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                
                // Append it to the URL
                const req = await fetch(`/api/player-handler?deviceId=${deviceId}&code=${deviceCode}&timezone=${encodeURIComponent(tz)}`);
                
                // --- CRITICAL FIX: Handle Deleted Devices Safely ---
                if (!req.ok) {
                    console.error("API Fetch Failed:", req.status);
                    
                    // ONLY wipe memory if the server explicitly says 404 (Not Found).
                    // If it is 500 (Server Error), we KEEP the code and retry later.
                    if (req.status === 404) {
                         console.warn("Device deleted on server. Resetting player...");
                         localStorage.removeItem('ss_device_code');
                         window.location.reload(true);
                         return;
                    }
                    
                    // For 500 errors or network glitches, just wait.
                    updateStatus('Connection Error');
                    return; 
                }
                
                const response = await req.json();
                
                // Safety Check: Ensure response is valid
                if (!response || !response.device) return;

                const { device, playlist } = response;

                // --- STICKY LOGO LOGIC ---
                const logoEl = document.getElementById('sticky-logo');
                if (device.logo_url) {
                    logoEl.src = device.logo_url;
                    logoEl.className = 'absolute z-[60] max-w-[200px] max-h-[200px] object-contain transition-all duration-500 ';
                    if (device.logo_position === 'top-left') logoEl.classList.add('top-8', 'left-8');
                    else if (device.logo_position === 'top-right') logoEl.classList.add('top-8', 'right-8');
                    else if (device.logo_position === 'bottom-left') logoEl.classList.add('bottom-8', 'left-8');
                    else if (device.logo_position === 'bottom-right') logoEl.classList.add('bottom-8', 'right-8');
                    else logoEl.classList.add('top-8', 'right-8'); // Default
                    logoEl.classList.remove('hidden');
                } else {
                    logoEl.classList.add('hidden');
                }

                // 2. REMOTE REFRESH LOGIC
                if (device.refresh_requested) {
                    updateStatus('Updating...');
                    setTimeout(() => { 
                        window.location.reload(true); 
                    }, 1000);
                    return; 
                }

                // 3. REMOTE UNPAIR LOGIC
                if (device.unpair_requested) {
                    updateStatus('Unpairing...');
                    localStorage.removeItem('ss_device_code');
                    window.location.reload(true);
                    return;
                }

                // 4. REMOTE SCREENSHOT LOGIC
                if (device.screenshot_requested) {
                    updateStatus('Capturing Screen...');
                    try {
                        const canvas = await html2canvas(document.body, {
                            useCORS: true,
                            allowTaint: true,
                            ignoreElements: (element) => element.tagName === 'VIDEO' && element.readyState < 2
                        });
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
                        const fileName = `screenshots/${deviceId}.jpg`;

                        await sb.storage.from('media').upload(fileName, blob, { upsert: true });
                        const { data: publicUrl } = sb.storage.from('media').getPublicUrl(fileName);

                        await sb.from('devices').update({ 
                            screenshot_url: publicUrl.publicUrl, 
                            screenshot_requested: false 
                        }).eq('id', deviceId);
                        
                        updateStatus('Screenshot Uploaded');
                    } catch (err) {
                        console.error("Screenshot Failed:", err);
                    }
                }

                // 5. SYNC PLAYLIST
                if (playlist && Array.isArray(playlist)) {
                    if (JSON.stringify(playlist) !== JSON.stringify(currentPlaylist)) {
                        console.log("New Playlist Received");
                        localStorage.setItem('cached_playlist', JSON.stringify(playlist));
                        imageCache = {}; 
                        currentPlaylist = playlist;
                        currentIndex = 0;
                        
                        if (typeof preloadMedia === "function") {
                             preloadMedia(currentPlaylist);
                        } else if (typeof preloadImages === "function") {
                             preloadImages(currentPlaylist);
                        }

                        if (!isPlaying && currentPlaylist.length > 0) {
                            runLoop();
                        }
                    }
                }
                
                updateStatus('Online');

            } catch (error) {
                console.error("Update Error:", error);
                // Keep playing current content if update fails
            }
        }

    function updateStatus(msg) { 
            const el = document.getElementById('status-pill');
            // Reset to base
            el.className = 'status-dot';
            
            const text = msg.toLowerCase();

            if (text.includes('offline') || text.includes('error') || text.includes('failed')) {
                el.classList.add('status-red');
            } 
            else if (text.includes('checking') || text.includes('updating') || text.includes('capturing') || text.includes('unpairing')) {
                el.classList.add('status-orange');
            } else {
                // Online / Playback (Hidden)
                el.classList.add('status-green');
            }
            
            el.innerText = ''; // Ensure no text is rendered
        }
    
    function stopPlayback() { currentPlaylist = []; isPlaying = false; document.getElementById('active-slide').src = ''; }
        
      function preloadMedia(q) { 
    q.forEach(i => { 
        if (imageCache[i.url]) return; // Already processed

        const type = i.type || 'image'; 

        if (type.includes('image')) { 
            const img = new Image(); 
            img.src = i.url; 
            imageCache[i.url] = img; 
        } 
        else if (type.includes('video')) {
            // STEP 1: Fetch the video to force it into the Browser Cache
            fetch(i.url, { mode: 'cors' }).then(r => {
                if (!r.ok) throw new Error("Video preload failed");
                
                // STEP 2: Just mark it as 'true'. 
                // We don't need to store the Blob or a BlobURL in RAM.
                // When the <video> tag later sets src = i.url, 
                // the browser will see it's already in the cache and play instantly.
                imageCache[i.url] = true; 
                console.log("Video cached in browser storage:", i.url);
            }).catch(err => console.error("Video Preload Fail:", err));
        }
    }); 
}

        function runLoop() {
            if (!currentPlaylist.length) return;
            isPlaying = true;
            
            const item = currentPlaylist[currentIndex];
            const imgEl = document.getElementById('active-slide');
            const vidEl = document.getElementById('active-video');
            const iframeEl = document.getElementById('active-iframe');
            const widgetEl = document.getElementById('active-widget');
            
            // Determine Duration (Default to item duration or 10s)
            let duration = (item.duration || 10) * 1000;

            // Hide everything first
            imgEl.classList.add('hidden');
            vidEl.classList.add('hidden');
            iframeEl.classList.add('hidden');
            widgetEl.classList.add('hidden');
            vidEl.pause();
            iframeEl.src = ''; // Clear iframe memory

            if (item.type.includes('video')) {
                // --- VIDEO MODE ---
                vidEl.classList.remove('hidden');
                vidEl.src = item.url;
                vidEl.play().catch(e => console.error("Video Play Error:", e));
                vidEl.onended = () => { if (item.duration === 0) nextSlide(); };
                
            } else if (item.type === 'web') {
                // --- WEB EMBED MODE ---
                iframeEl.src = item.url;
                iframeEl.classList.remove('hidden');
                
            } else if (item.type === 'widget_ticker') {
                // --- TICKER MODE ---
                const meta = item.metadata || {};
                widgetEl.style.backgroundColor = meta.bgColor || '#0a0a0a';
                widgetEl.style.color = meta.textColor || '#d4ff00';
                widgetEl.innerHTML = `
                    <div style="font-size: ${meta.fontSize || 48}px; width: 100%; overflow: hidden; white-space: nowrap; font-weight: bold;">
                        <marquee scrollamount="20">${meta.message || 'Scrolling Ticker...'}</marquee>
                    </div>`;
                widgetEl.classList.remove('hidden');
                
            } else if (item.type === 'widget_weather') {
                // --- WEATHER MODE ---
                const city = item.metadata?.city || 'Local Area';
                widgetEl.style.backgroundColor = '#111827'; // Dark slate
                widgetEl.style.color = '#ffffff';
                
                // Show loading state first
                widgetEl.innerHTML = `
                    <svg class="w-32 h-32 mb-8 text-sky-400 animate-pulse" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"></path></svg>
                    <h1 class="text-5xl font-bold tracking-tight">${city}</h1>
                `;
                widgetEl.classList.remove('hidden');
                
                // Fetch Live Weather from free wttr.in JSON API
                fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`)
                    .then(r => r.json())
                    .then(data => {
                        const temp = data.current_condition[0].temp_C;
                        const desc = data.current_condition[0].weatherDesc[0].value;
                        widgetEl.innerHTML = `
                            <h1 class="text-[12rem] font-black tracking-tighter text-white leading-none">${temp}°</h1>
                            <h2 class="text-6xl font-semibold mt-4 text-sky-400">${desc}</h2>
                            <p class="text-3xl mt-8 text-gray-500 uppercase tracking-[0.3em] font-bold">${city}</p>
                        `;
                    }).catch(e => console.log('Weather fetch failed', e));
                    
            } else {
                // --- IMAGE MODE ---
                imgEl.classList.remove('hidden');
                imgEl.classList.remove('fade-enter-active');
                setTimeout(() => {
                    imgEl.src = item.url;
                    imgEl.classList.add('fade-enter-active');
                }, 100);
            }

            if (!item.type.includes('video') || item.duration > 0) {
                // Clear any existing timeout to prevent rapid-fire bug
                if (window.slideTimeout) clearTimeout(window.slideTimeout);
                window.slideTimeout = setTimeout(nextSlide, duration);
            }
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            runLoop();
        }

        // Refresh daily for memory management
        setTimeout(() => {
            window.location.reload();
        }, 24 * 60 * 60 * 1000);

        // Start
        initApp();

        // SW Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Fail:', err));
            });
        }
    </script>
</body>
</html>
